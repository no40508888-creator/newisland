const gq = s=>encodeURIComponent(s);
function dirURL(r){const u="https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+gq(r[0])+"&destination="+gq(r[r.length-1]);
  return r.length>2?u+"&waypoints="+r.slice(1,-1).map(gq).join("%7C"):u}
const placeURL = q=>"https://www.google.com/maps/search/?api=1&query="+gq(q);
function mapsHTML(d){const m=MAPS[d]; if(!m) return "";
  let h=`<div class="sec"><h3>Google 地圖</h3>`;
  if(m.route) h+=`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"><a class="btn" href="${dirURL(m.route)}" target="_blank" rel="noopener">開啟今天的導航路線</a>${m.alt?`<a class="btn ghost" href="${dirURL(m.alt[1])}" target="_blank" rel="noopener">${esc(m.alt[0])}</a>`:""}</div>`;
  h+=`<div class="cats">${m.places.map(([l,q])=>`<a class="maplink" href="${placeURL(q)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}</div>`;
  if(m.route) h+=`<p class="muted" style="font-size:.78rem;margin:10px 0 0">路線依景點順序排好，實際路況以 NZTA 為準。山區沒訊號，出發前在 Google 地圖 App 下載離線地圖。</p>`;
  return h+`</div>`}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayISO = ()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const md = iso=>{const [,m,d]=iso.split("-");return (+m)+"/"+(+d)};
const tripDay = ()=>DAYS.find(x=>x.d===todayISO());
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- day view ---------- */
function dayHTML(x){
  const i=DAYS.indexOf(x);
  let h=`<div class="dayhead"><div class="date">${md(x.d)}（${x.w}） · 第 ${i} 天</div><h2>${esc(x.title)}</h2>
   <div class="meta"><span class="pill">住 ${esc(x.stay)}</span>${x.drive!=="—"?`<span class="pill">開車 ${esc(x.drive)}</span>`:""}</div></div>`;
  h+=`<div class="sec"><h3>行程</h3><ul class="timeline">${x.items.map(([t,s])=>`<li><span class="t">${esc(t)}</span><div>${esc(s)}</div></li>`).join("")}</ul></div>`;
  if(x.warn) h+=`<div class="callout"><h3>今天注意</h3><ul class="plain">${x.warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
  if(x.plan) h+=`<div class="callout info"><h3>天氣不好或封路的備案</h3><ul class="plain">${x.plan.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
  if(x.roads){
    const km=x.roads.filter(r=>!/^(或|替代)/.test(r[0])).reduce((a,r)=>a+(+r[2]||0),0);
    h+=`<div class="sec"><h3>行車路線 <span class="muted mono" style="font-size:.8rem;font-weight:400">約 ${km} km</span></h3><div class="tablewrap"><table><thead><tr><th>路段</th><th>公路</th><th>km</th><th>車程</th></tr></thead><tbody>${x.roads.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="n mono">${esc(r[2])}</td><td class="n">${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>`;
    h+=`<dl class="kv" style="margin-top:10px">${x.fuel?`<dt>加油</dt><dd>${esc(x.fuel)}</dd>`:""}${x.stops?`<dt>臨停</dt><dd>${esc(x.stops)}</dd>`:""}</dl></div>`;
  } else if(x.stops){h+=`<div class="sec"><dl class="kv"><dt>臨停</dt><dd>${esc(x.stops)}</dd></dl></div>`}
  h+=mapsHTML(x.d);
  if(x.photo) h+=`<div class="sec"><h3>拍照</h3><div class="tablewrap"><table><tbody>${x.photo.map(p=>`<tr><td><b>${esc(p[0])}</b><br><span class="muted">${esc(p[1])}</span></td><td>${esc(p[2])}</td></tr>`).join("")}</tbody></table></div></div>`;
  if(x.food) h+=`<div class="sec"><h3>吃什麼</h3><ul class="plain">${x.food.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;
  const spent=S.expenses.filter(e=>e.date===x.d);
  if(spent.length){const t=spent.reduce((a,e)=>a+toTWD(e),0);h+=`<div class="sec"><h3>這天花了</h3><div class="mono">NT$ ${fmt(t)}　<span class="muted">${spent.length} 筆</span></div></div>`}

  return h+nav;

/* ---------- checklist ---------- */
const ckey=(g,i)=>"c"+g+"_"+i;
function countChecks(){let n=0,d=0;CHECKS.forEach((g,gi)=>g.items.forEach((_,i)=>{n++;if(S.checks[ckey(gi,i)])d++}));return {n,d}}
function listHTML(){
  const c=countChecks();

   CHECKS.map((g,gi)=>`<div class="sec"><h3>${esc(g.g)}</h3>${g.items.map((it,i)=>{const k=ckey(gi,i),on=!!S.checks[k];return `<label class="check${on?" done":""}"><input type="checkbox" data-ck="${k}"${on?" checked":""}><span>${esc(it)}</span></label>`}).join("")}</div>`).join("");

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  if(S.tab==="days"&&!S.day) S.day=(tripDay()||DAYS[1]).d;
  renderStrip();
  const v=$("#view");
  v.innerHTML = S.tab==="today"?todayHTML(): S.tab==="days"?dayHTML(DAYS.find(x=>x.d===S.day)||DAYS[0]): S.tab==="notes"?notesHTML(): S.tab==="money"?moneyHTML(): listHTML();
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");

/* ---------- storage (db when available, browser otherwise) ---------- */
let db=null;
async function connect(){
  if(!window.claude||!window.claude.use) return;
  S.mode="loading"; if(S.tab==="money") render();
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ S.mode="local"; if(S.tab==="money") render(); return; }
  S.mode="db";
  db.collection("expenses").onSnapshot(snap=>{
    S.expenses=snap.docs.map(d=>Object.assign({id:d.id},d.data())); saveLocal();
    if(S.tab==="money"||S.tab==="days"||S.tab==="today") softRender();
  },()=>{S.mode="local";softRender()});
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists){S.settings=Object.assign({},S.settings,s.data());saveLocal(); if(S.tab==="money") softRender();}});
  db.doc("checks/main").onSnapshot(s=>{ if(s.exists){S.checks=Object.assign({},s.data());saveLocal(); if(S.tab==="list"||S.tab==="today") softRender();}});
  softRender();
}
/* re-render without wiping a half-typed expense */
function softRender(){
  const a=$("#f-amt"),n=$("#f-note"),c=$("#f-cur"),d=$("#f-date"),p=$("#f-payer");
  const keep=a?{a:a.value,n:n.value,c:c.value,d:d.value,p:p.value,f:document.activeElement&&document.activeElement.id}:null;
  render();
  if(keep&&$("#f-amt")){$("#f-amt").value=keep.a;$("#f-note").value=keep.n;$("#f-cur").value=keep.c;$("#f-date").value=keep.d;$("#f-payer").value=keep.p;if(keep.f&&$("#"+keep.f))$("#"+keep.f).focus()}
}

async function addExpense(e){
  if(db){ try{ await db.collection("expenses").add(e); return true; }catch(err){ toast("沒存到，請確認網路後再按一次"); return false; } }
  e.id="l"+Date.now(); S.expenses.push(e); saveLocal(); return true;
}
async function delExpense(id){
  if(db&&!id.startsWith("l")){ try{ await db.doc("expenses/"+id).delete(); }catch(err){ toast("刪除失敗，請稍後再試"); } return; }
  S.expenses=S.expenses.filter(x=>x.id!==id); saveLocal(); render();
}
async function saveChecks(){ saveLocal(); if(db){ try{ await db.doc("checks/main").set(S.checks); }catch(e){ toast("勾選沒同步，請確認網路"); } } }
async function saveSettings(){ saveLocal(); if(db){ try{ await db.doc("settings/main").set(S.settings); }catch(e){ toast("設定沒同步，請確認網路"); } } }

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-go]"); if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.armed=null;saveLocal();render();window.scrollTo(0,0);return}
  if(t.dataset.go){S.tab="days";S.day=t.dataset.go;saveLocal();render();window.scrollTo(0,0);return}

  if(t.dataset.cat){S.cat=t.dataset.cat;document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===S.cat));return}
  if(t.dataset.del){const id=t.dataset.del; if(S.armed===id){S.armed=null;delExpense(id)} else {S.armed=id;softRender();setTimeout(()=>{if(S.armed===id){S.armed=null;softRender()}},4000)} return}
  if(t.id==="s-save"){const p1=$("#s-p1").value.trim()||"Wan",p2=$("#s-p2").value.trim()||"旅伴",r=parseFloat($("#s-rate").value);
    S.settings=Object.assign({},S.settings,{payers:[p1,p2],rate:r>0?r:19});saveSettings();render();toast("設定已儲存");return}
});
document.addEventListener("click",ev=>{

  const blob=new Blob([JSON.stringify({app:"nz27-handbook",v:1,exported:new Date().toISOString(),expenses:S.expenses,settings:S.settings,checks:S.checks},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="紐西蘭手冊備份-"+todayISO()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("已匯出備份");
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="bk-import"){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="nz27-handbook")throw 0;
      const ids=new Set(S.expenses.map(e=>e.id));(o.expenses||[]).forEach(e=>{if(!ids.has(e.id))S.expenses.push(e)});
      if(o.settings)S.settings=Object.assign({},S.settings,o.settings);if(o.checks)S.checks=Object.assign({},S.checks,o.checks);
      saveLocal();render();toast("已匯入，重複的記錄會略過")}catch(e){toast("這不是手冊的備份檔")}};r.readAsText(f);return}
  const k=ev.target.dataset&&ev.target.dataset.ck; if(!k) return;
  S.checks=Object.assign({},S.checks,{[k]:ev.target.checked}); if(!ev.target.checked) delete S.checks[k];
  ev.target.closest(".check").classList.toggle("done",ev.target.checked);
  const c=countChecks(); const pr=document.querySelector(".progress"); if(pr) pr.textContent=`已完成 ${c.d} / ${c.n}`;
  saveChecks();
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="addf") return; ev.preventDefault();
  const amt=parseFloat($("#f-amt").value); if(!(amt>0)){toast("請輸入金額");return}
  const e={amt,cur:$("#f-cur").value,cat:S.cat,date:$("#f-date").value,payer:$("#f-payer").value,note:$("#f-note").value.trim(),ts:new Date().toISOString()};
  const btn=ev.target.querySelector("button[type=submit]"); btn.disabled=true;
  const ok=await addExpense(e); btn.disabled=false;
  if(ok){ toast(`已記下 ${e.cur==="NZD"?"NZ$":"NT$"} ${amt}`); if(!db) render(); else { $("#f-amt").value=""; $("#f-note").value=""; } }
});

loadLocal();
if(tripDay()&&S.tab!=="money"&&S.tab!=="list") S.tab="today";
render();
connect();
</script>
</body></html>
