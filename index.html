<title>首爾濟州 9 日遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, sticky day strip, fixed bottom tab bar; Jeju palette: tangerine accent on basalt ink, sea-teal secondary */
:root{
  --bg:#F6F4F0; --card:#FFFFFF; --ink:#26221F; --muted:#6E655E; --line:#E6DFD6;
  --accent:#E06A12; --accent-soft:#FCE7D4; --sea:#0F7C86; --sea-soft:#D7EEEF;
  --amber:#9A5B00; --amber-soft:#FBEFD2; --red:#B3362B; --red-soft:#F8DEDA; --green:#2D7A45;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1715; --card:#24201D; --ink:#EEE8E2; --muted:#AA9F95; --line:#38312C;
  --accent:#FF9447; --accent-soft:#45291A; --sea:#5CC7CF; --sea-soft:#173538;
  --amber:#E8B04A; --amber-soft:#3A2D16; --red:#F08A7E; --red-soft:#3D1F1C; --green:#6CC48A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1715; --card:#24201D; --ink:#EEE8E2; --muted:#AA9F95; --line:#38312C;
  --accent:#FF9447; --accent-soft:#45291A; --sea:#5CC7CF; --sea-soft:#173538;
  --amber:#E8B04A; --amber-soft:#3A2D16; --red:#F08A7E; --red-soft:#3D1F1C; --green:#6CC48A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;line-height:1.25}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
a{color:var(--sea)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700}

.mast{padding-block:18px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mast h1{font-size:1.6rem}
.mast h1 i{font-style:normal;color:var(--accent)}
.mast .sub{font-size:.82rem;color:var(--muted)}

.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 9px;text-align:center;min-width:52px}
.chip b{display:block;font-family:var(--f-mono);font-size:.9rem}
.chip span{font-size:.7rem;color:var(--muted)}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-current="true"] span{color:inherit;opacity:.9}
.chip.today{box-shadow:inset 0 -3px 0 var(--sea)}

.dayhead{padding-block:18px 10px;display:grid;gap:4px}
.dayhead .date{font-family:var(--f-mono);color:var(--accent);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sea-soft);color:var(--ink)}
.pill.warn{background:var(--amber-soft)}
.pill.red{background:var(--red-soft)}
.pill.must{background:var(--accent-soft)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sec>h3{margin-bottom:8px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:baseline}
.timeline .t{font-family:var(--f-mono);font-size:.85rem;color:var(--accent)}
.timeline li>div{min-width:0}
.must-mark{color:var(--accent);font-weight:700}
ul.plain{margin:0;padding-left:1.15em;display:grid;gap:4px}
.callout{border-radius:12px;padding:12px 14px;margin-top:12px;background:var(--amber-soft)}
.callout.red{background:var(--red-soft)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row>*{min-width:0}
.field{display:grid;gap:3px}

.bar{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.status{font-size:.78rem;color:var(--muted);margin-top:8px}

 {g:"住宿與交通",items:["預約龍平接駁巴士（1/24 去、1/25 回，回程要趕 20:20 班機）","雪具、雪衣租借","濟州租車（1/26 取車、1/30 還車），加兒童座椅","排好濟州 1/26–1/29 的行程","1/26–1/28 三晚住宿","1/14 前決定 Baro Ato 要不要保留（之後取消收全額）"]},
 {g:"出發前一週確認營業",items:["Saebyeol 羊駝牧場、山茶花之丘、Osulloc","史努比花園、Aqua Planet","熟成到的候位方式（CatchTable）","1100 高地 CCTV 看有沒有雪","牛島船班時間","龍平滑雪場開放的雪道"]},
 {g:"手機 App",items:["NAVER Map 或 Kakao Map（Google 地圖在韓國導航不準）","Kakao T（叫車）","Papago（翻譯，可拍照翻菜單）","CatchTable（餐廳候位）","韓國網卡或 eSIM"]},
 {g:"冬季裝備",items:["毛帽、手套、圍巾、防風外套","滑雪用防水手套、護目鏡","防滑鞋或簡易冰爪","雪球夾（大創可買）","保溫瓶","塑膠袋（裝烤肉味衣服）","伴手禮照回程行李額度分配（Wan 35 kg、Nien-Tzu 20 kg）"]}

const CATS = ["住宿","交通油錢","餐飲","門票活動","超市","購物","其他"];
DAYS.forEach(x=>x.k=x.d);

/* ---------- state ---------- */
const S = {tab:"today",day:null,expenses:[],settings:{rate:43,payers:["Wan","朋友"]},checks:{},
  cat:"餐飲",mode:"local",armed:null,area:"全部"};
const LS = "korea9-app";
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");
  if(o.expenses)S.expenses=o.expenses; if(o.settings)S.settings=Object.assign(S.settings,o.settings);
  if(o.checks)S.checks=o.checks; if(o.tab)S.tab=o.tab; if(o.day)S.day=o.day;}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({expenses:S.expenses,settings:S.settings,checks:S.checks,tab:S.tab,day:S.day}))}catch(e){}}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = t=>t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
const todayISO = ()=>iso(new Date());
const dateOf = i=>DAYS[i].d;
const md = d=>{if(!d) return ""; const [,m,dd]=d.split("-");return (+m)+"/"+(+dd)};
const dayIdx = k=>DAYS.findIndex(x=>x.k===k);
const tripDay = ()=>{const t=todayISO(); const i=DAYS.findIndex((_,j)=>dateOf(j)===t); return i<0?null:DAYS[i]};
const dayLabel = i=>`Day ${i+1} · ${md(DAYS[i].d)}（${DAYS[i].w}）`;
const naver = q=>"https://map.naver.com/p/search/"+encodeURIComponent(q);
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- day view ---------- */
function dayHTML(x){
  const i=DAYS.indexOf(x);
  let h=`<div class="dayhead"><div class="date">${esc(dayLabel(i))}</div><h2>${esc(x.title)}</h2>
   <div class="meta"><span class="pill">住 ${esc(x.stay)}</span><span class="pill must">${esc(x.area)}</span></div></div>`;
  h+=`<div class="sec"><h3>行程</h3><ul class="timeline">${x.items.map(([t,s,m])=>`<li><span class="t">${esc(t)}</span><div>${m?'<span class="must-mark">✓ 必去</span> ':""}${esc(s)}</div></li>`).join("")}</ul></div>`;
  const bk=BOOKINGS.filter(b=>b.d===x.d);
  if(bk.length) h+=`<div class="sec"><h3>今天的訂位</h3>${bk.map(bookingRow).join("")}</div>`;
  if(x.draft) h+=`<div class="callout info"><h3>規劃中</h3>濟州只確定日期，這天先放半年前的初步安排，之後再調整。</div>`;
  if(x.warn) h+=`<div class="callout"><h3>今天注意</h3><ul class="plain">${x.warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
  if(x.plan) h+=`<div class="callout info"><h3>備案</h3><ul class="plain">${x.plan.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
  const ps=PLACES.filter(p=>p[3].split(" ").includes(x.k)&&p[2]);
  if(ps.length) h+=`<div class="sec"><h3>今天的地點</h3>${ps.map(placeRow).join("")}</div>`;
  if(x.food) h+=`<div class="sec"><h3>吃什麼</h3><ul class="plain">${x.food.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;
  const spent=S.expenses.filter(e=>e.date===x.k);
  if(spent.length){const t=spent.reduce((a,e)=>a+toTWD(e),0);h+=`<div class="sec"><h3>這天花了</h3><div class="mono">NT$ ${fmt(t)}　<span class="muted">${spent.length} 筆</span></div></div>`}
  const nav=`<div style="display:flex;justify-content:space-between;margin-top:16px">${i>0?`<button class="btn ghost small" data-go="${DAYS[i-1].k}">‹ Day ${i}</button>`:"<span></span>"}${i<DAYS.length-1?`<button class="btn ghost small" data-go="${DAYS[i+1].k}">Day ${i+2} ›</button>`:""}</div>`;
  return h+nav;
}
function renderStrip(){
  const st=$("#strip"); st.hidden=S.tab!=="days";
  if(st.hidden) return;
  const t=todayISO();
  st.innerHTML=DAYS.map((x,i)=>`<button class="chip${dateOf(i)===t?" today":""}" data-go="${x.k}" aria-current="${x.k===S.day}"><b>${md(x.d)}</b><span>${x.w}</span></button>`).join("");
  const cur=st.querySelector('[aria-current="true"]'); if(cur) cur.scrollIntoView({inline:"center",block:"nearest"});
}

/* ---------- today ---------- */

  const x=tripDay();
  if(x) return `<div class="callout info" style="margin-top:14px"><b>旅途中</b>：今天是 Day ${DAYS.indexOf(x)+1}。出門前看一下天氣和營業時間。</div>`+dayHTML(x);
  const t=todayISO(), start=DAYS[0].d;
  const done=countChecks();

  if(t>DAYS[DAYS.length-1].d){
    h+=`<div class="count"><div class="big">回來了</div><p class="muted">旅程結束。記帳頁還留著全部花費。</p></div>`;

  }

/* ---------- ledger ---------- */
const toTWD = e=>e.cur==="TWD"?+e.amt:+e.amt/(+S.settings.rate||43);
const fmt = n=>Math.round(n).toLocaleString("en-US");
function defaultDay(){const x=tripDay();return x?x.k:DAYS[0].k}
function moneyHTML(){
  const ex=[...S.expenses].sort((a,b)=>(b.date+b.ts).localeCompare(a.date+a.ts));
  const total=ex.reduce((a,e)=>a+toTWD(e),0), rate=+S.settings.rate||43;
  const [p1,p2]=S.settings.payers;
  const byCat=CATS.map(c=>[c,ex.filter(e=>e.cat===c).reduce((a,e)=>a+toTWD(e),0)]).filter(r=>r[1]>0);
  const maxC=Math.max(1,...byCat.map(r=>r[1]));
  const paid1=ex.filter(e=>e.payer===p1).reduce((a,e)=>a+toTWD(e),0), paid2=total-paid1;
  const diff=(paid1-paid2)/2;
  const modeNote={db:"已同步儲存，換手機或重新整理都還在。",local:window.claude?"目前只存在這支手機的瀏覽器裡（登入 claude.ai 開啟可同步）。":"記帳存在這個瀏覽器裡；換手機、換瀏覽器或清除瀏覽資料就看不到。",loading:"連線中…"}[S.mode];
  let h=`<div class="dayhead"><h2>記帳</h2><div class="muted" style="font-size:.85rem">匯率 1 TWD ＝ ${rate} KRW（可在下方修改）</div></div>
  <div class="totals"><div class="tot"><div class="label">總花費</div><div class="v">NT$ ${fmt(total)}</div></div><div class="tot"><div class="label">約合韓元</div><div class="v">₩ ${fmt(total*rate)}</div></div></div>
  <div class="sec"><h3>記一筆</h3><form class="add" id="addf">
    <div class="field"><label for="f-amt">金額</label><div class="amt"><input id="f-amt" type="number" inputmode="decimal" step="1" min="0" placeholder="0" required><select id="f-cur"><option>KRW</option><option>TWD</option></select></div></div>
    <div class="field"><label>類別</label><div class="cats" id="cats">${CATS.map(c=>`<button type="button" data-cat="${c}" aria-pressed="${c===S.cat}">${c}</button>`).join("")}</div></div>
    <div class="row"><div class="field"><label for="f-date">哪一天</label><select id="f-date">${DAYS.map((x,i)=>`<option value="${x.k}"${x.k===defaultDay()?" selected":""}>${esc(dayLabel(i))}</option>`).join("")}<option value="pre">行前已付</option></select></div>
    <div class="field"><label for="f-payer">誰付的</label><select id="f-payer"><option>${esc(p1)}</option><option>${esc(p2)}</option></select></div></div>
    <div class="field"><label for="f-note">備註</label><input id="f-note" type="text" maxlength="60" placeholder="例：龍平雪具租借"></div>
    <button class="btn" type="submit">記下來</button>
  </form><div class="status">${modeNote}</div></div>`;
  if(byCat.length) h+=`<div class="sec"><h3>分類</h3>${byCat.map(([c,v])=>`<div class="catrow"><span>${c}</span><div class="bar"><i style="width:${(v/maxC*100).toFixed(1)}%"></i></div><span class="mono" style="text-align:right">${fmt(v)}</span></div>`).join("")}
    <p style="margin:10px 0 0;font-size:.9rem">${esc(p1)} 付 NT$ ${fmt(paid1)}，${esc(p2)} 付 NT$ ${fmt(paid2)}。${Math.abs(diff)<1?"兩邊剛好平分。":`平分的話，${esc(diff>0?p2:p1)} 要給 ${esc(diff>0?p1:p2)} <b class="mono">NT$ ${fmt(Math.abs(diff))}</b>。`}</p></div>`;
  h+=`<div class="sec"><h3>明細</h3>`;
  if(!ex.length) h+=`<p class="muted" style="margin:0">還沒有記錄。上面輸入金額、選類別，按「記下來」就會出現在這裡，也會顯示在當天的行程頁。</p>`;
  const groups={}; ex.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  Object.keys(groups).sort().reverse().forEach(d=>{
    const g=groups[d]; const sum=g.reduce((a,e)=>a+toTWD(e),0); const i=dayIdx(d);
    h+=`<div class="daygroup"><h4><span>${i<0?"行前已付":esc(dayLabel(i))}</span><span class="mono">NT$ ${fmt(sum)}</span></h4>${g.map(e=>`<div class="entry"><div><b>${esc(e.cat)}</b> ${esc(e.note||"")}<br><small>${esc(e.payer)} 付</small></div><div class="amtv">${e.cur==="KRW"?"₩":"NT$"} ${(+e.amt).toLocaleString("en-US",{maximumFractionDigits:0})}${e.cur==="KRW"?`<br><small>≈ NT$ ${fmt(toTWD(e))}</small>`:""}</div><button class="del${S.armed===e.id?" armed":""}" data-del="${esc(e.id)}">${S.armed===e.id?"再按一次刪除":"刪除"}</button></div>`).join("")}</div>`;
  });
  h+=`</div>
  <div class="sec"><h3>設定</h3><div class="row">
   <div class="field"><label for="s-p1">付款人 1</label><input id="s-p1" value="${esc(p1)}" maxlength="12"></div>
   <div class="field"><label for="s-p2">付款人 2</label><input id="s-p2" value="${esc(p2)}" maxlength="12"></div></div>
   <div class="row" style="margin-top:10px"><div class="field"><label for="s-rate">1 TWD ＝ ? KRW</label><input id="s-rate" type="number" step="0.1" min="1" value="${rate}"></div>
   <div class="field" style="align-content:end"><button class="btn ghost" id="s-save" type="button">儲存設定</button></div></div></div>`;
  return h;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  if(S.tab==="days"&&!S.day) S.day=(tripDay()||DAYS[0]).k;
  renderStrip();
  const v=$("#view");
  v.innerHTML = S.tab==="today"?todayHTML(): S.tab==="days"?dayHTML(DAYS.find(x=>x.k===S.day)||DAYS[0]): S.tab==="places"?placesHTML(): S.tab==="money"?moneyHTML(): prepHTML();
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
}

/* ---------- storage (db when available, browser otherwise) ---------- */
let db=null;
async function connect(){
  if(!window.claude||!window.claude.use) return;
  S.mode="loading"; if(S.tab==="money") render();
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ S.mode="local"; if(S.tab==="money") render(); return; }
  S.mode="db";
  db.collection("expenses").onSnapshot(snap=>{
    S.expenses=snap.docs.map(d=>Object.assign({id:d.id},d.data())); saveLocal();
    if(S.tab==="money"||S.tab==="days"||S.tab==="today") softRender();
  },()=>{S.mode="local";softRender()});
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists){S.settings=Object.assign({},S.settings,s.data());saveLocal(); softRender();}});
  db.doc("checks/main").onSnapshot(s=>{ if(s.exists){S.checks=Object.assign({},s.data());saveLocal(); if(S.tab==="prep"||S.tab==="today") softRender();}});
  softRender();
}
/* re-render without wiping a half-typed expense */
function softRender(){
  const a=$("#f-amt"),n=$("#f-note"),c=$("#f-cur"),d=$("#f-date"),p=$("#f-payer");
  const keep=a?{a:a.value,n:n.value,c:c.value,d:d.value,p:p.value,f:document.activeElement&&document.activeElement.id}:null;
  render();
  if(keep&&$("#f-amt")){$("#f-amt").value=keep.a;$("#f-note").value=keep.n;$("#f-cur").value=keep.c;$("#f-date").value=keep.d;$("#f-payer").value=keep.p;if(keep.f&&$("#"+keep.f))$("#"+keep.f).focus()}
}

async function addExpense(e){
  if(db){ try{ await db.collection("expenses").add(e); return true; }catch(err){ toast("沒存到，請確認網路後再按一次"); return false; } }
  e.id="l"+Date.now(); S.expenses.push(e); saveLocal(); return true;
}
async function delExpense(id){
  if(db&&!id.startsWith("l")){ try{ await db.doc("expenses/"+id).delete(); }catch(err){ toast("刪除失敗，請稍後再試"); } return; }
  S.expenses=S.expenses.filter(x=>x.id!==id); saveLocal(); render();
}
async function saveChecks(){ saveLocal(); if(db){ try{ await db.doc("checks/main").set(S.checks); }catch(e){ toast("勾選沒同步，請確認網路"); } } }
async function saveSettings(){ saveLocal(); if(db){ try{ await db.doc("settings/main").set(S.settings); }catch(e){ toast("設定沒同步，請確認網路"); } } }

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-go]"); if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.armed=null;saveLocal();render();window.scrollTo(0,0);return}
  if(t.dataset.go){S.tab="days";S.day=t.dataset.go;saveLocal();render();window.scrollTo(0,0);return}
  if(t.dataset.tabgo){S.tab=t.dataset.tabgo;saveLocal();render();window.scrollTo(0,0);return}
  if(t.dataset.area){S.area=t.dataset.area;render();return}
  if(t.dataset.cat){S.cat=t.dataset.cat;document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===S.cat));return}
  if(t.dataset.del){const id=t.dataset.del; if(S.armed===id){S.armed=null;delExpense(id)} else {S.armed=id;softRender();setTimeout(()=>{if(S.armed===id){S.armed=null;softRender()}},4000)} return}
  if(t.id==="s-save"){const p1=$("#s-p1").value.trim()||"Wan",p2=$("#s-p2").value.trim()||"朋友",r=parseFloat($("#s-rate").value);
    S.settings=Object.assign({},S.settings,{payers:[p1,p2],rate:r>0?r:43}); saveSettings(); render();toast("設定已儲存");return}
});
document.addEventListener("change",ev=>{
  const k=ev.target.dataset&&ev.target.dataset.ck; if(!k) return;
  S.checks=Object.assign({},S.checks,{[k]:ev.target.checked}); if(!ev.target.checked) delete S.checks[k];
  ev.target.closest(".check").classList.toggle("done",ev.target.checked);
  const c=countChecks(); const pr=document.querySelector(".progress"); if(pr) pr.textContent=`已完成 ${c.d} / ${c.n}`;
  saveChecks();
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="addf") return; ev.preventDefault();
  const amt=parseFloat($("#f-amt").value); if(!(amt>0)){toast("請輸入金額");return}
  const e={amt,cur:$("#f-cur").value,cat:S.cat,date:$("#f-date").value,payer:$("#f-payer").value,note:$("#f-note").value.trim(),ts:new Date().toISOString()};
  const btn=ev.target.querySelector("button[type=submit]"); btn.disabled=true;
  const ok=await addExpense(e); btn.disabled=false;
  if(ok){ toast(`已記下 ${e.cur==="KRW"?"₩":"NT$"} ${amt.toLocaleString("en-US")}`); if(!db) render(); else { $("#f-amt").value=""; $("#f-note").value=""; } }
});

loadLocal();
if(tripDay()&&S.tab!=="money"&&S.tab!=="prep") S.tab="today";
render();
connect();
</script>
</body>
</html>
